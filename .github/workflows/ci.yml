name: ci

# What CI can actually check without a GPU, a dataset download or an API key:
# lint, types, unit tests, a training smoke test on a tiny model, and that the
# image builds. The full training run and the latency benchmark need hardware
# and are not faked here.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3

      - name: install
        run: |
          uv venv --python 3.12
          # The CPU torch wheel: CI has no GPU and the CUDA build is 2.5 GB.
          uv pip install --index-url https://download.pytorch.org/whl/cpu torch
          uv pip install -e ".[train,monitor]"
          uv pip install pytest ruff mypy types-PyYAML

      - name: lint
        run: uv run ruff check .

      - name: format
        run: uv run ruff format --check .

      - name: types
        run: uv run mypy src/arabic_nlp

      - name: tests
        run: uv run pytest -q

  training-smoke:
    # Catches a broken collator, a label mismatch or a frozen model without
    # needing a GPU: 200 rows, 30 steps, and the loss must fall below the
    # random-guess baseline of ln(5) = 1.61.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3

      - name: install
        run: |
          uv venv --python 3.12
          uv pip install --index-url https://download.pytorch.org/whl/cpu torch
          uv pip install -e ".[train]"

      - name: prepare a tiny dataset
        run: uv run python scripts/prepare_data.py

      - name: training smoke test
        run: uv run python scripts/train_transformer.py --smoke

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: arabic-nlp-platform:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
