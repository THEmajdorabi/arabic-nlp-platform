global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # The custom gauges: class distribution, mean confidence, batch size, drift.
  - job_name: dialect-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # The instrumentator's standard HTTP metrics, on a separate path so the two
  # exporters do not fight over the registry.
  - job_name: dialect-api-http
    metrics_path: /http-metrics
    static_configs:
      - targets: ["api:8000"]
